# PROTFIG example figures. Run:   ../protfig --config figures.toml --jobs 4
# Each [[figure]] is one figure; keys are the command-line options without "--".
# Paths are relative to this file.

[defaults]
out = "figures"

# --- protein + protein: SARS-CoV-2 spike RBD bound to ACE2, with glycans (6M0J)
[[figure]]
input = "inputs/6M0J.cif"
preset = "overview"
name = "6M0J"
chain_names = "A:ACE2,E:RBD"
glycans = "on"

# --- protein + ligand: CRBN–DDB1–CK1α with the molecular glue SJ3149 (8G66)
[[figure]]
input = "inputs/8G66.cif"
preset = "site"
name = "8G66"
chains = "B,C,A"

[[figure]]
input = "inputs/8G66.cif"
preset = "pocket"
name = "8G66"
chains = "B,C,A"

# --- SARS-CoV-2 Mpro with ensitrelvir: WT (8DZ0) and M49I mutant (8DZ1)
[[figure]]
input = "inputs/8DZ0.cif"
preset = "site"
style = "faded"
name = "8DZ0_faded"
chains = "A,B"

[[figure]]
input = "inputs/8DZ1.cif"
preset = "site"
style = "faded"
name = "8DZ1_M49I_faded"
chains = "A,B"
ref = "inputs/8DZ0.cif"
mutation = "chain A and resi 49"
mutation_original = "on"

[[figure]]
input = "inputs/8DZ0.cif"
preset = "density"
name = "8DZ0"
chains = "A,B"
map = "inputs/8dz0_2fofc.ccp4"

[[figure]]
input = "inputs/8DZ0.cif"
preset = "overview"
style = "outline"
name = "8DZ0_outline"
chains = "A"
highlight = "resi 200-306"

# --- outline, comic style: protein in white, peptide in green, facing the camera (4HT6)
[[figure]]
input = "inputs/4HT6.cif"
preset = "overview"
style = "comic"
name = "4HT6_comic"
chains = "A,B"

[[figure]]
input = "inputs/8DZ0.cif"
preset = "overview"
style = "illustrative"
name = "8DZ0_illustrative"
chains = "A,B"

[[figure]]
input = "inputs/8DZ0.cif"
preset = "overview"
style = "illustrative"
name = "8DZ0_illustrative_surface"
chains = "A"
repr = "surface"

[[figure]]
input = "inputs/8DZ0.cif"
preset = "overview"
style = "pastel"
name = "8DZ0_pastel"
chains = "A,B"

[[figure]]
input = "inputs/8DZ0.cif"
preset = "electrostatic"
name = "8DZ0"
chains = "A,B"

[[figure]]
input = "inputs/8DZ0.cif"
preset = "lipophilic"
name = "8DZ0"
chains = "A,B"

[[figure]]
input = "inputs/8DZ0.cif"
preset = "property"
name = "8DZ0_bfactor"
chains = "A"
key = "resi 41+145+166"

# --- AlphaFold model: free fatty acid receptor 2 (FFAR2, UniProt O15552), colored by pLDDT.
# From the AlphaFold Protein Structure Database (CC BY 4.0; Jumper et al. 2021, Varadi et al. 2024).
[[figure]]
input = "data/AF-O15552-F1-model_v6.pdb"
preset = "plddt"
name = "AF-O15552"

[[figure]]
input = "inputs/8DZ0.cif"
preset = "superpose"
name = "8DZ0_vs_8DZ1"
chains = "A,B"
ref = "inputs/8DZ1.cif"

# --- protein + peptide: MDM2 with the p53 peptide (1YCR)
[[figure]]
input = "inputs/1YCR.cif"
preset = "site"
name = "1YCR"
palette = "chimerax"

[[figure]]
input = "inputs/1YCR.cif"
preset = "footprint"
name = "1YCR"

[[figure]]
input = "inputs/1YCR.cif"
preset = "site"
style = "outline"
name = "1YCR_outline"

[[figure]]
input = "inputs/1YCR.cif"
preset = "profile"
name = "1YCR"

# --- protein + protein: barnase–barstar (1BRS, chains A and D)
[[figure]]
input = "inputs/1BRS.cif"
preset = "site"
style = "outline"
name = "1BRS_outline"
chains = "A,D"

[[figure]]
input = "inputs/1BRS.cif"
preset = "site"
name = "1BRS"
chains = "A,D"

[[figure]]
input = "inputs/1BRS.cif"
preset = "overview"
style = "illustrative"
name = "1BRS_illustrative"
chains = "A,D"

[[figure]]
input = "inputs/1BRS.cif"
preset = "footprint"
name = "1BRS"
chains = "A,D"

# --- oligomeric assembly (9P3Y)
[[figure]]
input = "inputs/9P3Y.cif"
preset = "overview"
style = "assembly"
name = "9P3Y_assembly"

# --- membrane protein: opsin in an SDPC bilayer with its water (one frame of an MD simulation)
[[figure]]
input = "data/opsin_membrane_md_frame.pdb"
preset = "membrane"
name = "opsin_md"
waters = true
water_layer = "all"
colors = "A:#3FAF5F"

# --- rhodopsin: retinal covalently bound to Lys296 (Schiff base); the bond is read from the file.
# Whole protein (covalent) and the link close up (site detects it)
[[figure]]
input = "inputs/1U19.cif"
preset = "covalent"
name = "1U19"
chains = "A"

[[figure]]
input = "inputs/1U19.cif"
preset = "site"
name = "1U19_retinal"
chains = "A"

# --- GFP: chromophore built into the chain (residues 65-67)
[[figure]]
input = "inputs/1EMA.cif"
preset = "covalent"
name = "1EMA"

# --- reuse the view and selections from a previously generated .pse, with another style
[[figure]]
input = "figures/site/8G66/8G66.pse"
preset = "site"
style = "faded"
name = "8G66_from_site_pse_faded"
